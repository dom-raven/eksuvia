name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # The initial commit shipped without cmd/eksuvia because a bare
      # "eksuvia" gitignore pattern matched the directory. `go build ./...`
      # did not catch it, because it runs against a working tree that still
      # had the file. Build from the tracked files only.
      - name: tracked files alone must build
        run: |
          mkdir -p /tmp/tracked
          git ls-files | tar -cf - -T - | tar -xf - -C /tmp/tracked
          cd /tmp/tracked && go build ./... && go test ./...

  # Provisioning needs a container runtime, so it is a separate job. It is
  # allowed to fail for now: end-to-end verification is the top roadmap item
  # and this job exists to make progress on it visible rather than to gate PRs.
  smoke:
    name: end-to-end smoke (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: build
        run: go build -o bin/eksuvia ./cmd/eksuvia

      - name: start eksuvia
        run: |
          # Bind all interfaces, not loopback: the kind API server runs in a
          # container and reaches the TokenReview webhook over the bridge
          # gateway, which a 127.0.0.1 listener would refuse.
          #
          # No Floci here, so only the surface eksuvia serves itself is
          # exercised; STS-backed authentication is not.
          nohup ./bin/eksuvia \
            --listen 0.0.0.0:4566 \
            --floci-endpoint http://127.0.0.1:4599 \
            --advertise-host 172.17.0.1 \
            --log-level debug > eksuvia.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4566/_eksuvia/health && break
            sleep 1
          done

      - name: API surface responds
        run: |
          set -x
          curl -sf http://127.0.0.1:4566/_eksuvia/health
          curl -sf http://127.0.0.1:4566/access-policies
          curl -sf "http://127.0.0.1:4566/addons/supported-versions?addonName=coredns"

      - name: create a cluster end to end
        run: |
          curl -sf -X POST http://127.0.0.1:4566/clusters \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci","roleArn":"arn:aws:iam::000000000000:role/eksClusterRole","version":"1.31"}'
          for _ in $(seq 1 90); do
            status=$(curl -sf http://127.0.0.1:4566/clusters/ci | grep -o '"status":"[A-Z]*"' || true)
            echo "status: $status"
            case "$status" in
              *ACTIVE*) echo "cluster reached ACTIVE"; exit 0 ;;
              *FAILED*) echo "cluster FAILED"; exit 1 ;;
            esac
            sleep 10
          done
          echo "timed out waiting for ACTIVE"
          exit 1

      - name: kubectl reaches the cluster
        run: |
          # Uses kind's admin kubeconfig, which authenticates by client
          # certificate. The IAM path needs Floci's STS and is not covered here.
          kind export kubeconfig --name eksuvia-ci
          kubectl get nodes -o wide
          kubectl get pods -A

      - name: control plane carries the EKS wiring
        run: |
          set -e
          manifest=$(docker exec eksuvia-ci-control-plane cat /etc/kubernetes/manifests/kube-apiserver.yaml)
          for flag in service-account-issuer service-account-signing-key-file \
                      authentication-token-webhook-config-file api-audiences; do
            echo "$manifest" | grep -q -- "--$flag" || { echo "MISSING: --$flag"; exit 1; }
          done
          echo "all EKS control-plane flags present"

          # CoreDNS and kube-proxy running at all proves the API server accepts
          # service-account tokens signed by the key eksuvia injected. If the
          # key had not taken effect they would fail to authenticate.
          kubectl -n kube-system wait --for=condition=Ready pod -l k8s-app=kube-dns --timeout=120s
          echo "service-account tokens verify against the injected signing key"

      - name: node group claims and labels real nodes
        run: |
          set -e
          curl -sf -X POST http://127.0.0.1:4566/clusters/ci/node-groups \
            -H 'Content-Type: application/json' \
            -d '{"nodegroupName":"workers","nodeRole":"arn:aws:iam::000000000000:role/eksNodeRole",
                 "instanceTypes":["t3.medium"],"scalingConfig":{"minSize":1,"maxSize":3,"desiredSize":2}}'
          for _ in $(seq 1 30); do
            status=$(curl -sf http://127.0.0.1:4566/clusters/ci/node-groups/workers | grep -o '"status":"[A-Z_]*"' || true)
            echo "nodegroup: $status"
            case "$status" in *ACTIVE*) break ;; *CREATE_FAILED*) exit 1 ;; esac
            sleep 5
          done
          kubectl get nodes -L eks.amazonaws.com/nodegroup,node.kubernetes.io/instance-type,topology.kubernetes.io/zone
          # Both pool workers should now carry the node group label.
          labelled=$(kubectl get nodes -l eks.amazonaws.com/nodegroup=workers --no-headers | wc -l)
          echo "nodes labelled: $labelled"
          [ "$labelled" -eq 2 ] || { echo "expected 2 labelled nodes"; exit 1; }

      - name: access policies reconcile into real RBAC
        run: |
          set -e
          arn='arn:aws:iam::000000000000:role/Developer'
          enc=$(python3 -c "import urllib.parse;print(urllib.parse.quote('$arn',safe=''))")
          curl -sf -X POST http://127.0.0.1:4566/clusters/ci/access-entries \
            -H 'Content-Type: application/json' -d "{\"principalArn\":\"$arn\"}"
          curl -sf -X POST "http://127.0.0.1:4566/clusters/ci/access-entries/$enc/access-policies" \
            -H 'Content-Type: application/json' \
            -d '{"policyArn":"arn:aws:eks::aws:cluster-access-policy/AmazonEKSViewPolicy",
                 "accessScope":{"type":"cluster"}}'
          sleep 3
          kubectl get clusterrolebindings -l eksuvia.dev/managed-by=eksuvia -o wide
          # The grant must be real, not just recorded in the API.
          kubectl auth can-i list pods --as "$arn" -A
          kubectl auth can-i delete pods --as "$arn" -A && { echo "view policy granted delete"; exit 1; } || true
          echo "access policy enforced by RBAC"

      # Everything below runs even when the steps above fail: this job exists
      # to produce a diagnosis, and a bare "exit 1" is not one.
      - name: diagnostics
        if: always()
        run: |
          echo "===== eksuvia log ====="
          cat eksuvia.log || true
          echo "===== containers ====="
          docker ps -a || true
          echo "===== kind clusters ====="
          kind get clusters || true
          echo "===== control-plane container log (tail) ====="
          docker logs --tail 120 eksuvia-ci-control-plane 2>&1 || true
          echo "===== static pod manifest: kube-apiserver ====="
          docker exec eksuvia-ci-control-plane cat /etc/kubernetes/manifests/kube-apiserver.yaml 2>&1 || true
          echo "===== assets visible on the node ====="
          docker exec eksuvia-ci-control-plane ls -la /etc/eksuvia 2>&1 || true
          echo "===== kubelet log (tail) ====="
          docker exec eksuvia-ci-control-plane journalctl -u kubelet --no-pager -n 80 2>&1 || true

      - name: export kind logs
        if: always()
        run: kind export logs ./kind-logs --name eksuvia-ci || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-diagnostics
          path: |
            eksuvia.log
            kind-logs/
          if-no-files-found: ignore
          retention-days: 7
